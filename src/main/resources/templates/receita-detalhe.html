<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${receita.nome} + ' · Cozinha em Dia'">Receita · Cozinha em Dia</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page narrow-page"><a class="back-link" th:href="@{/receitas}">← Voltar às receitas</a><div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div><section class="detail-hero"><div class="detail-art">✳</div><div><p class="eyebrow">RECEITA CADASTRADA</p><h1 th:text="${receita.nome}">Nome da receita</h1><p class="muted" th:text="${receita.descricao}">Descrição da receita</p><div class="detail-meta"><span>◷ <b th:text="${receita.tempoPreparoMin != null ? receita.tempoPreparoMin : '—'}">25</b> min</span><span>♧ <b th:text="${receita.porcoes != null ? receita.porcoes : '—'}">2</b> porções</span></div></div><a class="btn btn-outline btn-small" th:href="@{/receitas/{id}/editar(id=${receita.id})}">✎ Editar</a></section><div class="detail-columns"><section class="panel"><div class="section-heading"><h2>Ingredientes</h2><span class="count-pill" th:text="${itens.size()}">4</span></div><ul class="ingredient-checklist"><li th:each="item : ${itens}"><span class="check-box"></span><span th:text="${item.ingrediente.nome}">Ingrediente</span><strong><span th:text="${T(br.com.cozinhaemdia.service.ReceitaService).formatar(item.quantidade)}">2</span> <span th:text="${item.unidade}">unidade</span></strong></li></ul><a class="text-link" th:href="@{/o-que-posso-fazer}">Conferir na despensa →</a></section><section class="panel"><div class="section-heading"><h2>Modo de preparo</h2></div><div class="preparation-text" th:text="${receita.modoPreparo}">1. Misture os ingredientes.</div></section></div></main></body></html>
