<!doctype html>
<html th:lang="${#locale.toLanguageTag()}" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: head(${edicao} ? #{form.editar} : #{receitas.nova})}"></th:block></head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main class="page estreita">
  <a class="voltar" th:href="@{/receitas}"><svg class="i"><use href="#i-voltar"/></svg><span th:text="#{nav.receitas}">Receitas</span></a>
  <div class="page-head">
    <div>
      <h1 th:text="${edicao} ? #{form.editar} : #{receitas.nova}">Nova receita</h1>
      <p class="muted" th:if="${edicao && receita.adaptada}" th:text="#{form.adaptada(${receita.origemNome})}">Adaptada</p>
    </div>
  </div>
  <div class="alerta sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>
  <div class="alerta erro" th:if="${erro}" th:text="${erro}"></div>

  <form th:action="${formAction}" method="post" enctype="multipart/form-data">
    <fieldset class="bloco">
      <legend th:text="#{form.dados}">Dados da receita</legend>
      <div class="campos">
        <label><span th:text="#{campo.nome}">Nome</span><input type="text" name="nome" th:value="${form.nome()}" th:placeholder="#{form.nome-ph}" maxlength="120" required></label>
        <label><span th:text="#{form.descricao}">Descrição</span> <span class="opcional" th:text="#{form.opcional}">(opcional)</span><input type="text" name="descricao" th:value="${form.descricao()}" maxlength="500"></label>
        <div class="duas-colunas">
          <label><span th:text="#{form.tempo}">Tempo de preparo, em minutos</span><input type="number" name="tempoPreparoMin" min="1" th:value="${form.tempo()}"></label>
          <label><span th:text="#{detalhe.porcoes}">Porções</span><input type="number" name="porcoes" min="1" th:value="${form.porcoes()}"></label>
        </div>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend th:text="#{form.midia}">Foto e videoaula</legend>
      <p class="dica" th:text="#{form.midia-dica}">Tudo opcional.</p>
      <div class="midia-grade">
        <div class="bloco-midia">
          <h3><span th:text="#{form.foto}">Foto da receita</span> <small th:text="#{form.foto-formatos}">JPG, PNG, GIF ou WebP, até 5 MB</small></h3>
          <img class="previa" id="previa-capa" th:src="${receita != null && receita.capaUrl != null ? receita.capaUrl : ''}" th:hidden="${receita == null || receita.capaUrl == null}" th:alt="#{form.foto-atual}" alt="Foto atual da receita">
          <input type="file" name="imagem" accept="image/jpeg,image/png,image/gif,image/webp" data-previa="previa-capa" data-limite="5242880" th:attr="aria-label=#{form.foto}">
          <label><span th:text="#{form.foto-url}">Ou o endereço de uma imagem na internet</span><input type="url" name="imagemUrl" th:value="${form.imagemUrl()}" placeholder="https://"></label>
          <label class="check-linha" th:if="${receita != null && receita.temImagem}"><input type="checkbox" name="removerImagem"> <span th:text="#{form.remover-foto}">Remover a foto atual</span></label>
        </div>
        <div class="bloco-midia">
          <h3><span th:text="#{form.video}">Videoaula</span> <small th:text="#{form.video-dica}">YouTube ou arquivo próprio</small></h3>
          <label><span th:text="#{form.youtube}">Link do YouTube</span><input type="url" name="videoUrl" th:value="${form.videoUrl()}" placeholder="https://www.youtube.com/watch?v="></label>
          <label><span th:text="#{form.video-envio}">Ou envie um vídeo</span> <small th:text="#{form.video-formatos}">MP4 ou WebM, até 60 MB</small><input type="file" name="video" accept="video/mp4,video/webm" data-limite="62914560"></label>
          <p class="muted" th:if="${receita != null && receita.videoArquivo != null}" th:text="#{form.video-existente}">Há um vídeo enviado.</p>
          <label class="check-linha" th:if="${receita != null && receita.videoArquivo != null}"><input type="checkbox" name="removerVideo"> <span th:text="#{form.remover-video}">Remover o vídeo enviado</span></label>
        </div>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend th:text="#{detalhe.ingredientes}">Ingredientes</legend>
      <div id="lista-ingredientes-form">
        <div class="linha-ingrediente" data-linha th:each="l : ${linhasIngredientes}">
          <div class="campo-nome"><input type="text" name="ingNome" th:value="${l.nome()}" class="js-ingrediente" list="lista-ingredientes" autocomplete="off" th:placeholder="#{form.ingrediente-ph}" th:attr="aria-label=#{form.ingrediente-ph}"></div>
          <input type="text" name="ingQtd" th:value="${l.quantidade()}" inputmode="decimal" th:placeholder="#{form.qtd-ph}" th:attr="aria-label=#{despensa.quantidade}">
          <input type="text" name="ingUn" th:value="${l.unidade()}" list="lista-unidades" th:placeholder="#{form.unidade-ph}" th:attr="aria-label=#{form.unidade-ph}">
          <button class="btn-remover" type="button" data-remover-linha th:title="#{form.remover-ingrediente}" th:attr="aria-label=#{form.remover-ingrediente}">×</button>
        </div>
      </div>
      <button class="btn-adicionar" type="button" data-adicionar data-lista="lista-ingredientes-form" data-modelo="modelo-ingrediente" th:text="#{form.add-ingrediente}">Adicionar ingrediente</button>
      <datalist id="lista-ingredientes"><option th:each="s : ${sugestoes}" th:value="${s}"></option></datalist>
      <datalist id="lista-unidades"><option value="g"><option value="kg"><option value="ml"><option value="l"><option value="unidade"><option value="colher"><option value="colher de chá"><option value="xícara"><option value="dente"></datalist>
      <template id="modelo-ingrediente">
        <div class="linha-ingrediente" data-linha>
          <div class="campo-nome"><input type="text" name="ingNome" class="js-ingrediente" list="lista-ingredientes" autocomplete="off" th:placeholder="#{form.ingrediente-ph}" th:attr="aria-label=#{form.ingrediente-ph}"></div>
          <input type="text" name="ingQtd" inputmode="decimal" th:placeholder="#{form.qtd-ph}" th:attr="aria-label=#{despensa.quantidade}">
          <input type="text" name="ingUn" list="lista-unidades" th:placeholder="#{form.unidade-ph}" th:attr="aria-label=#{form.unidade-ph}">
          <button class="btn-remover" type="button" data-remover-linha th:title="#{form.remover-ingrediente}" th:attr="aria-label=#{form.remover-ingrediente}">×</button>
        </div>
      </template>
    </fieldset>

    <fieldset class="bloco">
      <legend th:text="#{detalhe.modo}">Modo de preparo</legend>
      <p class="dica" th:text="#{form.etapas-dica}">Uma etapa por bloco.</p>
      <div id="lista-etapas">
        <div class="linha-etapa" data-linha th:each="e, st : ${linhasEtapas}">
          <span class="num" th:text="${st.count}">1</span>
          <div>
            <input type="hidden" name="etapaChave" th:value="${st.index}">
            <input type="hidden" th:name="${'etapaFotoAtual_' + st.index}" th:value="${e.foto()}">
            <textarea th:name="${'etapaTexto_' + st.index}" th:text="${e.texto()}" th:placeholder="#{form.etapa-ph}" th:attr="aria-label=#{form.etapa-ph}"></textarea>
            <div class="etapa-foto">
              <img th:if="${!e.foto().isEmpty()}" th:src="@{/midia/{nome}(nome=${e.foto()})}" alt="Foto atual da etapa" th:id="${'previa-etapa-' + st.index}">
              <img th:if="${e.foto().isEmpty()}" th:id="${'previa-etapa-' + st.index}" hidden th:alt="#{form.foto-etapa}">
              <input type="file" th:name="${'etapaFoto_' + st.index}" accept="image/jpeg,image/png,image/gif,image/webp" th:attr="data-previa=${'previa-etapa-' + st.index},aria-label=#{form.foto-etapa}" data-limite="5242880">
              <button class="link-botao" type="button" data-tirar-foto th:if="${!e.foto().isEmpty()}">Remover foto atual</button>
            </div>
          </div>
          <button class="btn-remover" type="button" data-remover-linha th:title="#{form.remover-etapa}" th:attr="aria-label=#{form.remover-etapa}">×</button>
        </div>
      </div>
      <button class="btn-adicionar" type="button" data-adicionar data-lista="lista-etapas" data-modelo="modelo-etapa" th:text="#{form.add-etapa}">Adicionar etapa</button>
      <template id="modelo-etapa">
        <div class="linha-etapa" data-linha>
          <span class="num">1</span>
          <div>
            <input type="hidden" name="etapaChave" value="__CHAVE__">
            <input type="hidden" name="etapaFotoAtual___CHAVE__" value="">
            <textarea name="etapaTexto___CHAVE__" th:placeholder="#{form.etapa-ph}" th:attr="aria-label=#{form.etapa-ph}"></textarea>
            <div class="etapa-foto">
              <img id="previa-etapa-__CHAVE__" hidden th:alt="#{form.foto-etapa}">
              <input type="file" name="etapaFoto___CHAVE__" accept="image/jpeg,image/png,image/gif,image/webp" data-previa="previa-etapa-__CHAVE__" data-limite="5242880" th:attr="aria-label=#{form.foto-etapa}">
            </div>
          </div>
          <button class="btn-remover" type="button" data-remover-linha th:title="#{form.remover-etapa}" th:attr="aria-label=#{form.remover-etapa}">×</button>
        </div>
      </template>
    </fieldset>

    <div class="rodape-form"><a class="btn btn-secondary" th:href="@{${edicao ? '/receitas/' + receita.id : '/receitas'}}" th:text="#{form.cancelar}">Cancelar</a><button type="submit" class="btn btn-primary" th:text="${edicao} ? #{form.salvar-alteracoes} : #{form.salvar}">Salvar receita</button></div>
  </form>
</main>
</body>
</html>
