<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Criar conta · Cozinha em Dia</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><main class="auth-card"><a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark">✳</span><span>Cozinha em Dia<small>receitas & despensa</small></span></a><p class="eyebrow">COMECE POR AQUI</p><h1>Crie sua conta</h1><p class="muted">Suas receitas e sua despensa, organizadas em um só lugar.</p><div class="alert error" th:if="${erro}" th:text="${erro}"></div><form class="form-stack" th:action="@{/cadastro}" method="post"><label>Como podemos te chamar?<input type="text" name="nome" placeholder="Seu nome" required maxlength="100"></label><label>E-mail<input type="email" name="email" placeholder="voce@email.com" required autocomplete="email"></label><label>Senha<input type="password" name="senha" minlength="6" placeholder="Pelo menos 6 caracteres" required></label><label>Confirme a senha<input type="password" name="confirmarSenha" minlength="6" placeholder="Digite novamente" required></label><button class="btn btn-primary btn-full" type="submit">Criar minha conta <span>→</span></button></form><div class="auth-help"><span>Já tem uma conta?</span><a th:href="@{/login}">Fazer login</a></div></main><div class="auth-side"><div class="auth-quote"><span class="quote-icon">✦</span><p>Planeje menos. Aproveite mais a hora de cozinhar.</p><span>Guarde suas receitas favoritas e use melhor os ingredientes que já tem.</span></div></div></body></html>
