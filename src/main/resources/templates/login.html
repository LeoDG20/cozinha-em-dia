<!doctype html>
<html th:lang="${#locale.toLanguageTag()}" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: head(#{login.titulo})}"></th:block></head>
<body>
<main class="acesso">
  <div class="acesso-form">
    <div class="acesso-topo">
      <a class="brand" th:href="@{/login}">Cozinha em Dia</a>
      <th:block th:replace="~{fragments/idioma :: seletor}"></th:block>
    </div>
    <h1 th:text="#{login.titulo}">Entrar</h1>
    <div class="alerta erro" th:if="${param.erro}" th:text="#{login.erro}" style="margin:0">E-mail ou senha inválidos.</div>
    <div class="alerta sucesso" th:if="${param.saiu}" th:text="#{login.saiu}" style="margin:0">Você saiu da sua conta.</div>
    <form th:action="@{/login}" method="post">
      <label><span th:text="#{campo.email}">E-mail</span><input type="email" name="email" required autocomplete="email" autofocus></label>
      <label><span th:text="#{campo.senha}">Senha</span><input type="password" name="senha" required autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" type="submit" th:text="#{login.entrar}">Entrar</button>
    </form>
    <p class="acesso-rodape"><span th:text="#{login.sem-conta}">Ainda não tem conta?</span> <a th:href="@{/cadastro}" th:text="#{login.cadastre-se}">Cadastre-se</a></p>
    <p class="demo-conta"><span th:text="#{login.demo}">Conta de demonstração:</span> <b>demo@cozinha.local</b>, <span th:text="#{login.demo-senha}">senha</span> <b>demo123</b></p>
  </div>
</main>
</body>
</html>
