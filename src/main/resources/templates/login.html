<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: head('Entrar')}"></th:block></head>
<body>
<main class="acesso">
  <div class="acesso-form">
    <a class="brand" th:href="@{/login}">Cozinha em Dia</a>
    <h1>Entrar</h1>
    <div class="alerta erro" th:if="${param.erro}" style="margin:0">E-mail ou senha inválidos.</div>
    <div class="alerta sucesso" th:if="${param.saiu}" style="margin:0">Você saiu da sua conta.</div>
    <form th:action="@{/login}" method="post">
      <label>E-mail<input type="email" name="email" required autocomplete="email" autofocus></label>
      <label>Senha<input type="password" name="senha" required autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
    <p class="acesso-rodape">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    <p class="demo-conta">Conta de demonstração: <b>demo@cozinha.local</b>, senha <b>demo123</b></p>
  </div>
</main>
</body>
</html>
