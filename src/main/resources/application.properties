spring.application.name=cozinha-em-dia
server.port=8081

# PostgreSQL. Os valores padrão correspondem ao banco criado pelo CozinhaEmDia.exe
# e podem ser substituídos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cozinha_em_dia}
spring.datasource.username=${DB_USER:cozinha}
spring.datasource.password=${DB_PASSWORD:cozinha123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
# Envio de fotos e vídeos das receitas: até 60 MB por arquivo e 150 MB por formulário (várias fotos de etapas).
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=150MB

# Pasta onde ficam as imagens e os vídeos enviados (não é versionada).
app.uploads.dir=${UPLOADS_DIR:uploads}
