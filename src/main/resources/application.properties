spring.application.name=cozinha-em-dia
server.port=8081

# PostgreSQL. Os valores padrão correspondem ao docker-compose.yml do projeto
# e podem ser substituídos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cozinha_em_dia}
spring.datasource.username=${DB_USER:cozinha}
spring.datasource.password=${DB_PASSWORD:cozinha123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
